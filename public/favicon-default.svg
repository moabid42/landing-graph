<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .ink { stroke: #1f2328; }
    .dot { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; stroke: #30363d; }
      .ink { stroke: #e6edf3; }
      .dot { fill: #e6edf3; }
    }
  </style>
  <circle class="bg" cx="32" cy="32" r="29.5" stroke-width="3"/>
  <!-- trunk with one branch forking out and merging back — the graph mark.
       To use an initial instead, swap the paths below for:
       <text x="32" y="42" text-anchor="middle" font-size="36"
         font-family="ui-monospace, Menlo, monospace" class="dot">y</text>
       (y=42 optically centers a glyph by its ink extents; dominant-baseline
       is unreliable across favicon renderers) -->
  <path class="ink" d="M24 14 V50" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path class="ink" d="M24 24 q16 0 16 8 t-16 8" stroke-width="4"
    stroke-linecap="round" fill="none"/>
  <circle class="dot" cx="24" cy="24" r="5"/>
  <circle class="dot" cx="24" cy="40" r="5"/>
  <circle class="dot" cx="41" cy="32" r="5"/>
</svg>
