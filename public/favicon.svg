<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .m { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; stroke: #30363d; }
      .m { fill: #e6edf3; }
    }
  </style>
  <circle class="bg" cx="32" cy="32" r="29.5" stroke-width="3"/>
  <!-- baseline computed from the glyph's ink extents so the m is optically
       centered; dominant-baseline is unreliable across favicon renderers -->
  <text class="m" x="32" y="42" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
    font-size="36">m</text>
</svg>
