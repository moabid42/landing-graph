name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `npm ci` would otherwise run the prepare script and install git hooks
  # into a checkout that will never make a commit.
  HUSKY: 0

jobs:
  quality:
    name: lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            npx vitest run --coverage --coverage.reporter=text-summary 2>/dev/null \
              | sed -n '/Coverage summary/,/=====/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Build
        run: npm run build

      # A static import of mermaid would turn a 60 kB first load into 3 MB
      # without failing anything else.
      - name: Check the entry payload against its budget
        run: npm run size

      # Production dependencies only. A plain `npm audit` is dominated by the
      # lighthouse toolchain, whose one open advisory has no published fix —
      # gating on it would mean a permanently red build that everyone learns
      # to ignore. This gates on what a visitor actually downloads. See
      # SECURITY.md.
      - name: Audit what ships
        run: npm run audit

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Keyed on the lockfile, so a Playwright bump re-downloads and anything
      # else reuses the cached browser.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js builds the site and serves it with vite preview,
      # so this exercises the real bundle rather than the dev server.
      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # lighthouserc.cjs collects from staticDistDir, so there has to be a
      # dist/ to serve.
      - run: npm run build

      # The action brings its own Lighthouse and its own Chrome. That is the
      # whole reason it is an action and not a dependency: @lhci/cli pulled 72
      # packages into the lockfile, including extract-zip — an advisory with
      # no published fix, reached only through puppeteer's browser installer,
      # which nothing here ever calls. Running it out-of-tree keeps `npm
      # audit` clean without giving up the budgets.
      #
      # The budgets themselves did not move: same lighthouserc.cjs, and the
      # action ships the same Lighthouse 12.6 this repo used to install.
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          artifactName: lighthouse

  commit-messages:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint every commit on the branch
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
