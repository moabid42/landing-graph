name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `npm ci` would otherwise run the prepare script and install git hooks
  # into a checkout that will never make a commit.
  HUSKY: 0

jobs:
  quality:
    name: lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            npx vitest run --coverage --coverage.reporter=text-summary 2>/dev/null \
              | sed -n '/Coverage summary/,/=====/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Build
        run: npm run build

      # A static import of mermaid would turn a 60 kB first load into 3 MB
      # without failing anything else.
      - name: Check the entry payload against its budget
        run: npm run size

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Keyed on the lockfile, so a Playwright bump re-downloads and anything
      # else reuses the cached browser.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js builds the site and serves it with vite preview,
      # so this exercises the real bundle rather than the dev server.
      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Lighthouse runs on the same pinned Chromium as the e2e suite.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Lighthouse budgets
        run: npm run lighthouse

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

  commit-messages:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint every commit on the branch
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
