name: Deploy

# Builds the site, packages it as a GitHub Pages artifact and publishes it.
#
# One-time setup in the fork, and it cannot be automated from here:
#
#   Settings -> Pages -> Source -> "GitHub Actions"
#
# Until that is set the repo has no Pages site and the publish step fails with
# a bare 404. actions/configure-pages can create one, but its `enablement`
# input needs a personal access token and GITHUB_TOKEN is not allowed to use
# it, so a step here would only look like it helped.
#
# Routes are real paths, so the build needs a base path. It comes from
# seo.url in site.config.js (see src/paths.js): '/' behind a custom domain,
# '/<repo>/' at a project url. Set that one line correctly and a project
# site, a user site and a custom domain all build unchanged.
#
# The package job also uploads the artifact on a manual run, so you can grab
# the tarball from the run summary and deploy it somewhere else by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: a half-finished publish would
# leave the live site on a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  package:
    name: verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Nothing reaches the live site unverified. This repeats ci.yml on a
      # push to main on purpose: a deploy that depends on another workflow
      # having passed is a deploy that can publish an unchecked commit.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the end-to-end report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Check the entry payload against its budget
        run: npm run size

      # This is the package: a tarball of dist/ that deploy-pages publishes,
      # and that you can download from the run summary to deploy by hand.
      - name: Package dist/ for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
