name: Deploy

# Builds the site, packages it as a GitHub Pages artifact and publishes it.
#
# One-time setup in the fork: Settings -> Pages -> Source -> "GitHub Actions".
# Nothing else. `base: './'` in vite.config.js plus the hash router mean the
# build works unchanged at a project url (user.github.io/repo/), at a user
# site, and behind a custom domain — there is no base path to configure.
#
# The package job also uploads the artifact on a manual run, so you can grab
# the tarball from the run summary and deploy it somewhere else by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: a half-finished publish would
# leave the live site on a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  package:
    name: verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Nothing reaches the live site unverified. This repeats ci.yml on a
      # push to main on purpose: a deploy that depends on another workflow
      # having passed is a deploy that can publish an unchecked commit.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the end-to-end report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Check the entry payload against its budget
        run: npm run size

      # This is the package: a tarball of dist/ that deploy-pages publishes,
      # and that you can download from the run summary to deploy by hand.
      - name: Package dist/ for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
